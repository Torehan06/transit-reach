name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DATA_RELEASE_TAG: data-v2
  DATA_ARCHIVE_NAME: transit-reach-data.tar

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Download city data from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DATA_RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$DATA_ARCHIVE_NAME" \
            --dir /tmp
          tar -xf "/tmp/$DATA_ARCHIVE_NAME" -C dist
          rm -f "/tmp/$DATA_ARCHIVE_NAME"
          test -f dist/data/summary.json
          test -f dist/data/tiles/ankara.pmtiles
          ls -lh dist/data/summary.json
          echo "Loaded $(ls dist/data/tiles/*.pmtiles | wc -l) PMTiles archives"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
